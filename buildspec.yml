version: 0.2

# AWS CodeBuild spec — GitHub callback triggers CodeBuild, which builds in-account
# under its IAM service role (no GitHub-side credentials) and deploys the static
# site to S3 + invalidates CloudFront.
#
# ENV-DRIVEN, ONE PROJECT PER ENVIRONMENT. The CodeBuild PROJECT supplies these
# (intentionally NOT defaulted here, so a project can never deploy to the wrong
# bucket via a stale default):
#   VITE_WS_URL, S3_BUCKET, CF_DIST_ID
# Plus ONE of:
#   PKG_TRACK=stable|prerelease  -> resolve the f2ce-tools version+URL from the
#                                   GitHub Releases API at build time (newest
#                                   release of that channel), OR
#   VITE_PKG_URL + VITE_PKG_VERSION -> pin an exact package (legacy/manual).
#
#   test project  (webhook: test branch)   -> client-test.federation2.com, ws-test, PKG_TRACK=prerelease
#   prod project  (webhook: master branch) -> client.federation2.com,      ws prod, PKG_TRACK=stable

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - npm ci
  build:
    commands:
      # Resolve, guard, test, and build in ONE shell so PKG_TRACK's exported
      # VITE_PKG_* reach `npm run build` regardless of CodeBuild's per-command
      # shell behavior.
      - |
        set -e
        # When PKG_TRACK is set, resolve the newest f2ce-tools tag of that
        # channel and ship it. Uses `git ls-remote` (git protocol) rather than
        # the GitHub REST API on purpose: unauthenticated api.github.com calls
        # from CodeBuild's shared egress IP get rate-limited (403 -> empty),
        # whereas ls-remote is not rate-limited and needs no credentials.
        # Channel is read from the tag convention: stable releases are
        # v-prefixed (v3.2.0), prereleases are bare semver (3.2.4). The manifest
        # version is plain semver, so the leading "v" is stripped for
        # VITE_PKG_VERSION (else mudlet-web's version compare mismatches and
        # reinstalls every open). GitHub is cross-origin, so the asset is
        # fetched through the same ws->http proxy the client already uses
        # (derived from VITE_WS_URL).
        if [ -n "${PKG_TRACK:-}" ]; then
          [ -n "${VITE_WS_URL:-}" ] || { echo "ERROR: VITE_WS_URL required when PKG_TRACK is set" >&2; exit 1; }
          repo="https://github.com/federation2-community/f2ce-tools"
          tags=$(git ls-remote --tags --refs "$repo" | sed 's#.*refs/tags/##')
          if [ "$PKG_TRACK" = "stable" ]; then
            tag=$(printf '%s\n' "$tags" | grep -E '^v[0-9]' | sort -V | tail -1)
          elif [ "$PKG_TRACK" = "prerelease" ]; then
            tag=$(printf '%s\n' "$tags" | grep -E '^[0-9]+\.[0-9]+' | sort -V | tail -1)
          else
            echo "ERROR: PKG_TRACK must be 'stable' or 'prerelease' (got '$PKG_TRACK')" >&2; exit 1
          fi
          [ -n "$tag" ] || { echo "ERROR: could not resolve latest $PKG_TRACK f2ce-tools tag" >&2; exit 1; }
          asset="${repo}/releases/download/${tag}/f2ce-tools.mpackage"
          proxy=$(printf '%s' "$VITE_WS_URL" | sed -e 's#^wss://#https://#' -e 's#^ws://#http://#')
          enc=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=''))" "$asset")
          export VITE_PKG_VERSION="${tag#v}"
          export VITE_PKG_URL="${proxy}?url=${enc}"
          echo "PKG_TRACK=$PKG_TRACK -> f2ce-tools $tag (VITE_PKG_VERSION=${tag#v})"
        fi
        # Fail fast if the build-time config still isn't set (pinned or resolved).
        for v in VITE_WS_URL VITE_PKG_URL VITE_PKG_VERSION; do
          eval "val=\${$v:-}"
          [ -n "$val" ] || { echo "ERROR: $v not set on the CodeBuild project" >&2; exit 1; }
        done
        npm test
        npm run build
  post_build:
    commands:
      - |
        for v in S3_BUCKET CF_DIST_ID; do
          eval "val=\${$v:-}"
          [ -n "$val" ] || { echo "ERROR: $v not set on the CodeBuild project" >&2; exit 1; }
        done
      # Two-pass sync so .wasm keeps its content-type (wasmoon/PCRE2 need it).
      - aws s3 sync dist/ "s3://$S3_BUCKET/" --delete --exclude '*.wasm'
      - aws s3 sync dist/ "s3://$S3_BUCKET/" --exclude '*' --include '*.wasm' --content-type application/wasm
      - aws cloudfront create-invalidation --distribution-id "$CF_DIST_ID" --paths '/*'

artifacts:
  files:
    - './**/*'
  base-directory: dist
