version: 0.2

# AWS CodeBuild spec — GitHub callback triggers CodeBuild, which builds in-account
# under its IAM service role (no GitHub-side credentials) and deploys the static
# site to S3 + invalidates CloudFront.
#
# ENV-DRIVEN, ONE PROJECT PER ENVIRONMENT. The CodeBuild PROJECT supplies all of
# these (intentionally NOT defaulted here, so a project can never deploy to the
# wrong bucket via a stale default):
#   VITE_WS_URL, VITE_PKG_URL, VITE_PKG_VERSION, S3_BUCKET, CF_DIST_ID
#
#   test project  (webhook: test branch)  -> client-test.federation2.com, ws-test, rolling prerelease
#   prod project  (webhook: master branch) -> client.federation2.com,     ws prod, production release

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - npm ci
  build:
    commands:
      # Fail fast if the project didn't supply the build-time config.
      - |
        for v in VITE_WS_URL VITE_PKG_URL VITE_PKG_VERSION; do
          eval "val=\${$v:-}"
          [ -n "$val" ] || { echo "ERROR: $v not set on the CodeBuild project" >&2; exit 1; }
        done
      - npm test
      - npm run build
  post_build:
    commands:
      - |
        for v in S3_BUCKET CF_DIST_ID; do
          eval "val=\${$v:-}"
          [ -n "$val" ] || { echo "ERROR: $v not set on the CodeBuild project" >&2; exit 1; }
        done
      # Two-pass sync so .wasm keeps its content-type (wasmoon/PCRE2 need it).
      - aws s3 sync dist/ "s3://$S3_BUCKET/" --delete --exclude '*.wasm'
      - aws s3 sync dist/ "s3://$S3_BUCKET/" --exclude '*' --include '*.wasm' --content-type application/wasm
      - aws cloudfront create-invalidation --distribution-id "$CF_DIST_ID" --paths '/*'

artifacts:
  files:
    - './**/*'
  base-directory: dist
