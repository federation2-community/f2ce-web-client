name: Deploy
on:
  push:
    branches: [main]
permissions:
  id-token: write
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm }
      - run: npm ci
      - run: npm test
      - name: Build
        env:
          VITE_WS_URL: ${{ vars.VITE_WS_URL }}
          VITE_PKG_URL: ${{ vars.VITE_PKG_URL }}
          VITE_PKG_VERSION: ${{ vars.VITE_PKG_VERSION }}
        run: npm run build
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-west-2
      - name: Sync (wasm content-type; bucket root)
        run: |
          aws s3 sync dist/ "s3://${{ secrets.S3_BUCKET }}/" --delete --exclude '*.wasm'
          aws s3 sync dist/ "s3://${{ secrets.S3_BUCKET }}/" --exclude '*' --include '*.wasm' --content-type 'application/wasm'
      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${{ secrets.CF_DIST_ID }}" --paths '/*'
